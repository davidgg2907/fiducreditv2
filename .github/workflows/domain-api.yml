name: Validar API de recursos de dominio

on:
  pull_request:
    paths:
      - 'backend/app/Models/Domain/**'
      - 'backend/app/Http/Controllers/Domain/**'
      - 'backend/app/Http/Requests/Domain/**'
      - 'backend/app/Http/Resources/Domain/**'
      - 'backend/app/Services/Domain/**'
      - 'backend/routes/api.php'
      - '.github/workflows/domain-api.yml'
  push:
    branches: [main]
    paths:
      - 'backend/app/Models/Domain/**'
      - 'backend/app/Http/Controllers/Domain/**'
      - 'backend/app/Http/Requests/Domain/**'
      - 'backend/app/Http/Resources/Domain/**'
      - 'backend/app/Services/Domain/**'
      - 'backend/routes/api.php'
      - '.github/workflows/domain-api.yml'

permissions:
  contents: read

jobs:
  lint-and-routes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, zip, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Verificar formato y sintaxis PHP
        run: |
          find app/Models/Domain app/Http/Controllers/Domain app/Http/Requests/Domain app/Http/Resources/Domain app/Services/Domain -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l routes/api.php
      - name: Registrar rutas de API
        env:
          APP_ENV: testing
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: |
          php artisan route:list --path=api/v1 --json > /tmp/fiducredit-api-routes.json
          php -r '$r=json_decode(file_get_contents("/tmp/fiducredit-api-routes.json"), true); if(count($r)<400){fwrite(STDERR, "Faltan rutas de dominio: ".count($r)); exit(1);} echo count($r)." rutas registradas\n";'
