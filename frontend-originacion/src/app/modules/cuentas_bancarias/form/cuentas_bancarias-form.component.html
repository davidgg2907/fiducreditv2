<header class="panel heading">
  <div>
    <h2>{{ id ? 'Editar' : 'Crear' }} · Cuentas bancarias</h2>
    <p>Captura y edición de información</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-primary" type="submit" form="originacion-form" [disabled]="saving || loading || !ready || form.disabled || !permissions.can('cuentas_bancarias', id ? 'editar' : 'crear')"><span class="material-icons-outlined" aria-hidden="true">check</span> {{ saving ? 'Guardando…' : 'Guardar' }}</button>
    <a class="btn btn-outline" routerLink="/cuentas_bancarias"><span class="material-icons-outlined" aria-hidden="true">close</span> Cancelar</a>
  </div>
</header>
<p class="error" role="alert" *ngIf="error">{{ error }}</p>
<p class="panel muted" *ngIf="loading || !ready">Cargando información…</p>
<form id="originacion-form" [formGroup]="form" (ngSubmit)="save()">
  <section class="panel">
    <div class="section-heading">
      <span class="material-icons-outlined" aria-hidden="true">account_balance</span>
      <h3>Datos bancarios</h3>
    </div>
    <div class="fields">
      <label>
        Cliente *
        <select formControlName="client_id">
          <option [ngValue]="null">Seleccione</option>
          <option *ngFor="let option of client_idOptions" [value]="option.id">{{ option.label }}</option>
        </select>
        <small *ngIf="form.controls.client_id.invalid && form.controls.client_id.touched">Revise este campo.</small>
      </label>
      <label>
        Clave bancaria
        <input formControlName="bank_code" type="text">
        <small *ngIf="form.controls.bank_code.invalid && form.controls.bank_code.touched">Revise este campo.</small>
      </label>
      <label>
        Banco *
        <input formControlName="bank_name" type="text">
        <small *ngIf="form.controls.bank_name.invalid && form.controls.bank_name.touched">Revise este campo.</small>
      </label>
      <label>
        Titular *
        <input formControlName="holder_name" type="text">
        <small *ngIf="form.controls.holder_name.invalid && form.controls.holder_name.touched">Revise este campo.</small>
      </label>
      <label>
        CLABE
        <input formControlName="clabe" type="text">
        <small *ngIf="form.controls.clabe.invalid && form.controls.clabe.touched">Revise este campo.</small>
      </label>
      <label>
        Últimos cuatro dígitos
        <input formControlName="account_last4" type="text">
        <small *ngIf="form.controls.account_last4.invalid && form.controls.account_last4.touched">Revise este campo.</small>
      </label>
      <label>
        Tipo de cuenta
        <input formControlName="account_type" type="text">
        <small *ngIf="form.controls.account_type.invalid && form.controls.account_type.touched">Revise este campo.</small>
      </label>
    </div>
  </section>
  <section class="panel">
    <div class="section-heading">
      <span class="material-icons-outlined" aria-hidden="true">power_settings_new</span>
      <h3>Estado y operación</h3>
    </div>
    <div class="fields">
      <label>
        Principal
        <span class="switch-line">
          <input formControlName="primary" type="checkbox" role="switch">
          <span>{{ form.controls.primary.value ? 'Habilitado' : 'Deshabilitado' }}</span>
        </span>
        <small *ngIf="form.controls.primary.invalid && form.controls.primary.touched">Revise este campo.</small>
      </label>
      <label>
        Activa
        <span class="switch-line">
          <input formControlName="active" type="checkbox" role="switch">
          <span>{{ form.controls.active.value ? 'Habilitado' : 'Deshabilitado' }}</span>
        </span>
        <small *ngIf="form.controls.active.invalid && form.controls.active.touched">Revise este campo.</small>
      </label>
    </div>
  </section>
</form>
