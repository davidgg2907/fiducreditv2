<header class="panel heading">
  <div>
    <h2>{{ id ? 'Editar' : 'Crear' }} · Análisis crediticio</h2>
    <p>Captura y edición de información</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-primary" type="submit" form="originacion-form" [disabled]="saving || loading || !ready || form.disabled || !permissions.can('analisis_crediticio', id ? 'editar' : 'crear')"><span class="material-icons-outlined" aria-hidden="true">check</span> {{ saving ? 'Guardando…' : 'Guardar' }}</button>
    <a class="btn btn-outline" routerLink="/analisis_crediticio"><span class="material-icons-outlined" aria-hidden="true">close</span> Cancelar</a>
  </div>
</header>
<p class="error" role="alert" *ngIf="error">{{ error }}</p>
<p class="panel muted" *ngIf="loading || !ready">Cargando información…</p>
<form id="originacion-form" [formGroup]="form" (ngSubmit)="save()">
  <section class="panel">
    <div class="section-heading">
      <span class="material-icons-outlined" aria-hidden="true">analytics</span>
      <h3>Datos del análisis</h3>
    </div>
    <div class="fields">
      <label>
        Solicitud *
        <select formControlName="application_id">
          <option [ngValue]="null">Seleccione</option>
          <option *ngFor="let option of application_idOptions" [value]="option.id">{{ option.label }}</option>
        </select>
        <small *ngIf="form.controls.application_id.invalid && form.controls.application_id.touched">Revise este campo.</small>
      </label>
      <label>
        Analista *
        <input formControlName="analyst_id" type="number" step="1">
        <small *ngIf="form.controls.analyst_id.invalid && form.controls.analyst_id.touched">Revise este campo.</small>
      </label>
      <label>
        Estado
        <input formControlName="status" type="text">
        <small *ngIf="form.controls.status.invalid && form.controls.status.touched">Revise este campo.</small>
      </label>
      <label>
        Fecha de conclusión
        <input formControlName="completed_at" type="date">
        <small *ngIf="form.controls.completed_at.invalid && form.controls.completed_at.touched">Revise este campo.</small>
      </label>
    </div>
  </section>
  <section class="panel">
    <div class="section-heading">
      <span class="material-icons-outlined" aria-hidden="true">description</span>
      <h3>Hallazgos y recomendación</h3>
    </div>
    <div class="fields">
      <label class="wide">
        Hallazgos
        <textarea formControlName="findings" rows="3"></textarea>
        <small *ngIf="form.controls.findings.invalid && form.controls.findings.touched">Revise este campo.</small>
      </label>
      <label class="wide">
        Recomendación
        <textarea formControlName="recommendation" rows="3"></textarea>
        <small *ngIf="form.controls.recommendation.invalid && form.controls.recommendation.touched">Revise este campo.</small>
      </label>
    </div>
  </section>
</form>
