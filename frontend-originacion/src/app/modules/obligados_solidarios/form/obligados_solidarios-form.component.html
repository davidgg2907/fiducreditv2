<header class="panel heading">
  <div>
    <h2>{{ id ? 'Editar' : 'Crear' }} · Obligados solidarios</h2>
    <p>Captura y edición de información</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-primary" type="submit" form="originacion-form" [disabled]="saving || loading || !ready || form.disabled || !permissions.can('obligados_solidarios', id ? 'editar' : 'crear')"><span class="material-icons-outlined" aria-hidden="true">check</span> {{ saving ? 'Guardando…' : 'Guardar' }}</button>
    <a class="btn btn-outline" routerLink="/obligados_solidarios"><span class="material-icons-outlined" aria-hidden="true">close</span> Cancelar</a>
  </div>
</header>
<p class="error" role="alert" *ngIf="error">{{ error }}</p>
<p class="panel muted" *ngIf="loading || !ready">Cargando información…</p>
<form id="originacion-form" [formGroup]="form" (ngSubmit)="save()">
  <section class="panel">
    <div class="section-heading">
      <span class="material-icons-outlined" aria-hidden="true">groups</span>
      <h3>Identificación del obligado solidario</h3>
    </div>
    <div class="fields">
      <label>
        Solicitud *
        <select formControlName="application_id">
          <option [ngValue]="null">Seleccione</option>
          <option *ngFor="let option of application_idOptions" [value]="option.id">{{ option.label }}</option>
        </select>
        <small *ngIf="form.controls.application_id.invalid && form.controls.application_id.touched">Revise este campo.</small>
      </label>
      <label>
        Nombre completo *
        <input formControlName="full_name" type="text">
        <small *ngIf="form.controls.full_name.invalid && form.controls.full_name.touched">Revise este campo.</small>
      </label>
      <label>
        RFC
        <input formControlName="rfc" type="text">
        <small *ngIf="form.controls.rfc.invalid && form.controls.rfc.touched">Revise este campo.</small>
      </label>
      <label>
        Parentesco o relación *
        <input formControlName="relationship" type="text">
        <small *ngIf="form.controls.relationship.invalid && form.controls.relationship.touched">Revise este campo.</small>
      </label>
      <label>
        Teléfono
        <input formControlName="phone" type="text">
        <small *ngIf="form.controls.phone.invalid && form.controls.phone.touched">Revise este campo.</small>
      </label>
    </div>
  </section>
  <section class="panel">
    <div class="section-heading">
      <span class="material-icons-outlined" aria-hidden="true">payments</span>
      <h3>Información financiera</h3>
    </div>
    <div class="fields">
      <label>
        Ingreso mensual
        <input formControlName="monthly_income" type="number" step="0.01">
        <small *ngIf="form.controls.monthly_income.invalid && form.controls.monthly_income.touched">Revise este campo.</small>
      </label>
    </div>
  </section>
</form>
