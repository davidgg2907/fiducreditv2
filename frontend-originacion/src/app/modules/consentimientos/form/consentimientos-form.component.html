<header class="panel heading">
  <div>
    <h2>{{ id ? 'Editar' : 'Crear' }} · Consentimientos</h2>
    <p>Captura y edición de información</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-primary" type="submit" form="originacion-form" [disabled]="saving || loading || !ready || form.disabled || !permissions.can('consentimientos', id ? 'editar' : 'crear')"><span class="material-icons-outlined" aria-hidden="true">check</span> {{ saving ? 'Guardando…' : 'Guardar' }}</button>
    <a class="btn btn-outline" routerLink="/consentimientos"><span class="material-icons-outlined" aria-hidden="true">close</span> Cancelar</a>
  </div>
</header>
<p class="error" role="alert" *ngIf="error">{{ error }}</p>
<p class="panel muted" *ngIf="loading || !ready">Cargando información…</p>
<form id="originacion-form" [formGroup]="form" (ngSubmit)="save()">
  <section class="panel">
    <div class="section-heading">
      <span class="material-icons-outlined" aria-hidden="true">fact_check</span>
      <h3>Datos del consentimiento</h3>
    </div>
    <div class="fields">
      <label>
        Solicitud *
        <select formControlName="application_id">
          <option [ngValue]="null">Seleccione</option>
          <option *ngFor="let option of application_idOptions" [value]="option.id">{{ option.label }}</option>
        </select>
        <small *ngIf="form.controls.application_id.invalid && form.controls.application_id.touched">Revise este campo.</small>
      </label>
      <label>
        Tipo de consentimiento *
        <input formControlName="consent_type" type="text">
        <small *ngIf="form.controls.consent_type.invalid && form.controls.consent_type.touched">Revise este campo.</small>
      </label>
      <label>
        Versión *
        <input formControlName="version" type="text">
        <small *ngIf="form.controls.version.invalid && form.controls.version.touched">Revise este campo.</small>
      </label>
      <label>
        Fecha de aceptación
        <input formControlName="accepted_at" type="date">
        <small *ngIf="form.controls.accepted_at.invalid && form.controls.accepted_at.touched">Revise este campo.</small>
      </label>
    </div>
  </section>
  <section class="panel">
    <div class="section-heading">
      <span class="material-icons-outlined" aria-hidden="true">verified_user</span>
      <h3>Aceptación</h3>
    </div>
    <div class="fields">
      <label>
        Aceptado
        <span class="switch-line">
          <input formControlName="accepted" type="checkbox" role="switch">
          <span>{{ form.controls.accepted.value ? 'Habilitado' : 'Deshabilitado' }}</span>
        </span>
        <small *ngIf="form.controls.accepted.invalid && form.controls.accepted.touched">Revise este campo.</small>
      </label>
    </div>
  </section>
</form>
