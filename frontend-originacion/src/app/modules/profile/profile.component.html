<section class="profile-page cfg" *ngIf="!loading;else loadingState">
  <header class="cfg-panel cfg-heading profile-heading">
    <div><h2><span class="material-icons-outlined" aria-hidden="true">manage_accounts</span> Mi perfil</h2><p>Información de tu cuenta y seguridad de acceso.</p></div>
    <span class="profile-verified"><span class="material-icons-outlined" aria-hidden="true">verified_user</span> Cuenta protegida</span>
  </header>
  <p class="alert alert-success" role="status" *ngIf="success">{{success}}</p>
  <p class="alert alert-danger" role="alert" *ngIf="error">{{error}}</p>
  <div class="profile-grid">
    <section class="cfg-panel profile-card">
      <h3><span class="material-icons-outlined" aria-hidden="true">badge</span> Datos generales</h3>
      <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" class="profile-form">
        <div class="field"><label for="profile-name">Nombre completo</label><input id="profile-name" class="form-control" formControlName="nombre" autocomplete="name" required></div>
        <div class="field"><label for="profile-mail">Correo electrónico</label><input id="profile-mail" type="email" class="form-control" formControlName="correo" autocomplete="email" required></div>
        <div class="field"><label for="profile-current">Contraseña actual (para cambiar el correo)</label><input id="profile-current" type="password" class="form-control" formControlName="contrasena_actual" autocomplete="current-password"></div>
        <div class="profile-actions"><button class="btn btn-primary cfg-brand-btn" type="submit" [disabled]="saving||profileForm.invalid"><span class="material-icons-outlined" aria-hidden="true">save</span> {{saving?'Guardando...':'Guardar cambios'}}</button></div>
      </form>
    </section>
    <section class="cfg-panel profile-card">
      <h3><span class="material-icons-outlined" aria-hidden="true">lock</span> Seguridad y contraseña</h3>
      <form [formGroup]="passwordForm" (ngSubmit)="savePassword()" class="profile-form">
        <div class="field"><label for="pwd-current">Contraseña actual</label><input id="pwd-current" type="password" class="form-control" formControlName="contrasena_actual" autocomplete="current-password" required></div>
        <div class="field"><label for="pwd-new">Nueva contraseña</label><input id="pwd-new" type="password" class="form-control" formControlName="contrasena" autocomplete="new-password" required><small>Mínimo 12 caracteres.</small></div>
        <div class="field"><label for="pwd-confirm">Confirmar contraseña</label><input id="pwd-confirm" type="password" class="form-control" formControlName="contrasena_confirmation" autocomplete="new-password" required></div>
        <div class="profile-actions"><button class="btn btn-primary cfg-brand-btn" type="submit" [disabled]="passwordSaving||passwordForm.invalid"><span class="material-icons-outlined" aria-hidden="true">lock_reset</span> {{passwordSaving?'Guardando...':'Actualizar contraseña'}}</button></div>
      </form>
    </section>
  </div>
</section>
<ng-template #loadingState><div class="profile-loading cfg-panel" role="status">Cargando perfil…</div></ng-template>
