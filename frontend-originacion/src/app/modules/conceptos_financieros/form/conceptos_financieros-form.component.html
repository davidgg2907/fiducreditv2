<header class="panel heading">
  <div>
    <h2>{{ id ? 'Editar' : 'Crear' }} · Ingresos y egresos</h2>
    <p>Captura y edición de información</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-primary" type="submit" form="originacion-form" [disabled]="saving || loading || !ready || form.disabled || !permissions.can('conceptos_financieros', id ? 'editar' : 'crear')"><span class="material-icons-outlined" aria-hidden="true">check</span> {{ saving ? 'Guardando…' : 'Guardar' }}</button>
    <a class="btn btn-outline" routerLink="/conceptos_financieros"><span class="material-icons-outlined" aria-hidden="true">close</span> Cancelar</a>
  </div>
</header>
<p class="error" role="alert" *ngIf="error">{{ error }}</p>
<p class="panel muted" *ngIf="loading || !ready">Cargando información…</p>
<form id="originacion-form" [formGroup]="form" (ngSubmit)="save()">
  <section class="panel">
    <div class="section-heading">
      <span class="material-icons-outlined" aria-hidden="true">payments</span>
      <h3>Información financiera</h3>
    </div>
    <div class="fields">
      <label>
        Solicitud *
        <select formControlName="application_id">
          <option [ngValue]="null">Seleccione</option>
          <option *ngFor="let option of application_idOptions" [value]="option.id">{{ option.label }}</option>
        </select>
        <small *ngIf="form.controls.application_id.invalid && form.controls.application_id.touched">Revise este campo.</small>
      </label>
      <label>
        Tipo *
        <select formControlName="entry_type"><option value="">Seleccione</option><option value="income">Ingreso</option><option value="expense">Egreso</option></select>
        <small *ngIf="form.controls.entry_type.invalid && form.controls.entry_type.touched">Revise este campo.</small>
      </label>
      <label>
        Concepto *
        <input formControlName="concept" type="text">
        <small *ngIf="form.controls.concept.invalid && form.controls.concept.touched">Revise este campo.</small>
      </label>
      <label>
        Contraparte
        <input formControlName="counterparty" type="text">
        <small *ngIf="form.controls.counterparty.invalid && form.controls.counterparty.touched">Revise este campo.</small>
      </label>
      <label>
        Importe *
        <input formControlName="amount" type="number" step="0.01">
        <small *ngIf="form.controls.amount.invalid && form.controls.amount.touched">Revise este campo.</small>
      </label>
      <label>
        Periodicidad *
        <select formControlName="frequency"><option value="">Seleccione</option><option value="weekly">Semanal</option><option value="biweekly">Quincenal</option><option value="monthly">Mensual</option><option value="annual">Anual</option></select>
        <small *ngIf="form.controls.frequency.invalid && form.controls.frequency.touched">Revise este campo.</small>
      </label>
    </div>
  </section>
  <section class="panel">
    <div class="section-heading">
      <span class="material-icons-outlined" aria-hidden="true">description</span>
      <h3>Observaciones</h3>
    </div>
    <div class="fields">
      <label class="wide">
        Observaciones
        <textarea formControlName="observations" rows="3"></textarea>
        <small *ngIf="form.controls.observations.invalid && form.controls.observations.touched">Revise este campo.</small>
      </label>
    </div>
  </section>
</form>
