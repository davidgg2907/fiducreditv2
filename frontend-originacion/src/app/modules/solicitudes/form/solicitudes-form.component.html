<header class="panel heading">
  <div>
    <h2>{{ id ? 'Editar' : 'Crear' }} · Solicitudes de crédito</h2>
    <p>Captura y edición de información</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-primary" type="submit" form="originacion-form" [disabled]="saving || loading || !ready || form.disabled || !permissions.can('solicitudes', id ? 'editar' : 'crear')"><span class="material-icons-outlined" aria-hidden="true">check</span> {{ saving ? 'Guardando…' : 'Guardar' }}</button>
    <a class="btn btn-outline" routerLink="/solicitudes"><span class="material-icons-outlined" aria-hidden="true">close</span> Cancelar</a>
  </div>
</header>
<p class="error" role="alert" *ngIf="error">{{ error }}</p>
<p class="panel muted" *ngIf="loading || !ready">Cargando información…</p>
<form id="originacion-form" [formGroup]="form" (ngSubmit)="save()">
  <section class="panel">
    <div class="section-heading">
      <span class="material-icons-outlined" aria-hidden="true">assignment</span>
      <h3>Datos generales de la solicitud</h3>
    </div>
    <div class="fields">
      <label>
        Folio *
        <input formControlName="application_number" type="text">
        <small *ngIf="form.controls.application_number.invalid && form.controls.application_number.touched">Revise este campo.</small>
      </label>
      <label>
        Cliente *
        <select formControlName="client_id">
          <option [ngValue]="null">Seleccione</option>
          <option *ngFor="let option of client_idOptions" [value]="option.id">{{ option.label }}</option>
        </select>
        <small *ngIf="form.controls.client_id.invalid && form.controls.client_id.touched">Revise este campo.</small>
      </label>
      <label>
        Versión de producto *
        <select formControlName="product_version_id">
          <option [ngValue]="null">Seleccione</option>
          <option *ngFor="let option of product_version_idOptions" [value]="option.id">{{ option.label }}</option>
        </select>
        <small *ngIf="form.controls.product_version_id.invalid && form.controls.product_version_id.touched">Revise este campo.</small>
      </label>
      <label>
        Asesor *
        <select formControlName="advisor_id">
          <option [ngValue]="null">Seleccione</option>
          <option *ngFor="let option of advisor_idOptions" [value]="option.id">{{ option.label }}</option>
        </select>
        <small *ngIf="form.controls.advisor_id.invalid && form.controls.advisor_id.touched">Revise este campo.</small>
      </label>
      <label>
        Sucursal *
        <select formControlName="branch_id">
          <option [ngValue]="null">Seleccione</option>
          <option *ngFor="let option of branch_idOptions" [value]="option.id">{{ option.label }}</option>
        </select>
        <small *ngIf="form.controls.branch_id.invalid && form.controls.branch_id.touched">Revise este campo.</small>
      </label>
      <label>
        Versión de domicilio *
        <select formControlName="address_version_id">
          <option [ngValue]="null">Seleccione</option>
          <option *ngFor="let option of address_version_idOptions" [value]="option.id">{{ option.label }}</option>
        </select>
        <small *ngIf="form.controls.address_version_id.invalid && form.controls.address_version_id.touched">Revise este campo.</small>
      </label>
      <label>
        Cuenta bancaria
        <select formControlName="bank_account_id">
          <option [ngValue]="null">Seleccione</option>
          <option *ngFor="let option of bank_account_idOptions" [value]="option.id">{{ option.label }}</option>
        </select>
        <small *ngIf="form.controls.bank_account_id.invalid && form.controls.bank_account_id.touched">Revise este campo.</small>
      </label>
    </div>
  </section>
  <section class="panel">
    <div class="section-heading">
      <span class="material-icons-outlined" aria-hidden="true">payments</span>
      <h3>Condiciones financieras</h3>
    </div>
    <div class="fields">
      <label>
        Monto solicitado *
        <input formControlName="requested_amount" type="number" step="0.01">
        <small *ngIf="form.controls.requested_amount.invalid && form.controls.requested_amount.touched">Revise este campo.</small>
      </label>
      <label>
        Plazo *
        <input formControlName="requested_term" type="number" step="1">
        <small *ngIf="form.controls.requested_term.invalid && form.controls.requested_term.touched">Revise este campo.</small>
      </label>
      <label>
        Ingreso declarado
        <input formControlName="declared_income" type="number" step="0.01">
        <small *ngIf="form.controls.declared_income.invalid && form.controls.declared_income.touched">Revise este campo.</small>
      </label>
      <label>
        Egreso declarado
        <input formControlName="declared_expenses" type="number" step="0.01">
        <small *ngIf="form.controls.declared_expenses.invalid && form.controls.declared_expenses.touched">Revise este campo.</small>
      </label>
    </div>
  </section>
</form>
