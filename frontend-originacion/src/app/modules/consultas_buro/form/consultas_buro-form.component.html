<header class="panel heading">
  <div>
    <h2>{{ id ? 'Editar' : 'Crear' }} · Consultas de buró</h2>
    <p>Captura y edición de información</p>
  </div>
  <div class="header-actions">
    <button class="btn btn-primary" type="submit" form="originacion-form" [disabled]="saving || loading || !ready || form.disabled || !permissions.can('consultas_buro', id ? 'editar' : 'crear')"><span class="material-icons-outlined" aria-hidden="true">check</span> {{ saving ? 'Guardando…' : 'Guardar' }}</button>
    <a class="btn btn-outline" routerLink="/consultas_buro"><span class="material-icons-outlined" aria-hidden="true">close</span> Cancelar</a>
  </div>
</header>
<p class="error" role="alert" *ngIf="error">{{ error }}</p>
<p class="panel muted" *ngIf="loading || !ready">Cargando información…</p>
<form id="originacion-form" [formGroup]="form" (ngSubmit)="save()">
  <section class="panel">
    <div class="section-heading">
      <span class="material-icons-outlined" aria-hidden="true">manage_search</span>
      <h3>Datos de la consulta</h3>
    </div>
    <div class="fields">
      <label>
        Solicitud *
        <select formControlName="application_id">
          <option [ngValue]="null">Seleccione</option>
          <option *ngFor="let option of application_idOptions" [value]="option.id">{{ option.label }}</option>
        </select>
        <small *ngIf="form.controls.application_id.invalid && form.controls.application_id.touched">Revise este campo.</small>
      </label>
      <label>
        Proveedor *
        <input formControlName="provider" type="text">
        <small *ngIf="form.controls.provider.invalid && form.controls.provider.touched">Revise este campo.</small>
      </label>
      <label>
        Referencia externa
        <input formControlName="external_reference" type="text">
        <small *ngIf="form.controls.external_reference.invalid && form.controls.external_reference.touched">Revise este campo.</small>
      </label>
      <label>
        Fecha de consulta
        <input formControlName="consulted_at" type="date">
        <small *ngIf="form.controls.consulted_at.invalid && form.controls.consulted_at.touched">Revise este campo.</small>
      </label>
    </div>
  </section>
  <section class="panel">
    <div class="section-heading">
      <span class="material-icons-outlined" aria-hidden="true">analytics</span>
      <h3>Resultado</h3>
    </div>
    <div class="fields">
      <label>
        Puntuación
        <input formControlName="score" type="number" step="1">
        <small *ngIf="form.controls.score.invalid && form.controls.score.touched">Revise este campo.</small>
      </label>
      <label>
        Resultado
        <input formControlName="result" type="text">
        <small *ngIf="form.controls.result.invalid && form.controls.result.touched">Revise este campo.</small>
      </label>
    </div>
  </section>
</form>
