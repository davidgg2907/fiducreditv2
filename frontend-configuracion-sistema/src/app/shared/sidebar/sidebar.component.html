<aside class="credit-sidebar" [class.credit-sidebar--open]="getSideBarSate()" aria-label="Menú principal de configuración">
  <div class="credit-sidebar__brand">
    <img src="assets/branding/logo-nahuicredit.webp" alt="NAHUICREDIT" class="credit-sidebar__logo">
    <span>Configuración de Sistema</span>
  </div>
  <nav class="credit-sidebar__navigation" aria-label="Módulos">
    <ng-container *ngFor="let item of menuItems; trackBy: trackByCode">
      <details class="credit-sidebar__section" *ngIf="item.children?.length; else simpleItem" open>
        <summary class="credit-sidebar__heading">
          <mat-icon aria-hidden="true">{{item.icon || 'folder'}}</mat-icon>
          <span>{{item.text}}</span>
          <mat-icon class="credit-sidebar__chevron" aria-hidden="true">expand_more</mat-icon>
        </summary>
        <div class="credit-sidebar__children">
          <ng-container *ngFor="let child of item.children; trackBy: trackByCode">
            <a *ngIf="child.routerLink" class="credit-sidebar__link" [routerLink]="child.routerLink"
              routerLinkActive="credit-sidebar__link--active" (click)="closeOnMobile()">
              <mat-icon aria-hidden="true">{{child.icon || 'chevron_right'}}</mat-icon>
              <span>{{child.text}}</span>
            </a>
          </ng-container>
        </div>
      </details>
      <ng-template #simpleItem>
        <a *ngIf="item.routerLink" class="credit-sidebar__link" [routerLink]="item.routerLink"
          routerLinkActive="credit-sidebar__link--active" (click)="closeOnMobile()">
          <mat-icon aria-hidden="true">{{item.icon || 'dashboard'}}</mat-icon><span>{{item.text}}</span>
        </a>
      </ng-template>
    </ng-container>
  </nav>
  <button type="button" class="credit-sidebar__logout" (click)="logOut()">
    <mat-icon aria-hidden="true">logout</mat-icon><span>Cerrar sesión</span>
  </button>
</aside>
<div *ngIf="getSideBarSate()" class="credit-sidebar__backdrop" (click)="closeOnMobile()" aria-hidden="true"></div>
