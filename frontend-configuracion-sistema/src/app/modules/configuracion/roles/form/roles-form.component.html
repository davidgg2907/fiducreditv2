<section class="cfg"><header class="cfg-panel cfg-heading"><div><h2>{{id?'Editar':'Crear'}} · {{config.title}}</h2><p>Captura y edición de información</p></div><div class="cfg-header-actions">
  <button class="btn btn-primary" form="config-form" type="submit" [disabled]="saving||busy">{{saving?'Guardando...':'Guardar'}}</button>
  <a class="btn btn-outline-secondary cfg-header-cancel" [routerLink]="home"><span class="material-icons-outlined" aria-hidden="true">close</span> Cancelar</a>
</div></header><p *ngIf="error" class="alert alert-danger">{{error}}</p>
<form id="config-form" *ngIf="can(id?'editar':'crear')&&!busy" (ngSubmit)="save()" class="access-form">
 <div class="access-top">
  <section class="cfg-panel field"><label for="name">Nombre del rol *</label><input id="name" name="name" class="form-control" [(ngModel)]="data['name']" required maxlength="100"></section>
  <section class="cfg-panel"><h3>Sistemas</h3><div class="system-options">
   <button type="button" class="access-switch-row" role="switch" *ngFor="let s of systems" [attr.aria-checked]="selectedSystems.includes(s.code)" (click)="toggleSystem(s.code,!selectedSystems.includes(s.code))"><span class="access-switch-track" aria-hidden="true"></span><span>{{s.name}}</span></button>
  </div><small>Selecciona los sistemas y sus acciones. La selección se conserva mediante los permisos del rol.</small></section>
 </div>
 <section class="cfg-panel system-panel" *ngFor="let s of visibleSystems">
  <h3>{{s.name}}</h3>
  <div class="module-grid">
   <section class="module-card" *ngFor="let m of modulesFor(s.code); trackBy: trackModule">
    <h4>{{m.name}}</h4>
    <button type="button" class="access-switch-row" role="switch" *ngFor="let p of m.actions; trackBy: trackAction" [attr.aria-checked]="checked(p.permission)" (click)="check(p.permission,!checked(p.permission))"><span class="access-switch-track" aria-hidden="true"></span><span>{{p.name}}</span></button>
   </section>
  </div>
 </section>
 <section class="cfg-panel" *ngIf="modulesFor('').length">
  <h3>Permisos generales y heredados</h3><div class="module-grid">
   <section class="module-card" *ngFor="let m of modulesFor(''); trackBy: trackModule"><h4>{{m.name}}</h4>
    <button type="button" class="access-switch-row" role="switch" *ngFor="let p of m.actions; trackBy: trackAction" [attr.aria-checked]="checked(p.permission)" (click)="check(p.permission,!checked(p.permission))"><span class="access-switch-track" aria-hidden="true"></span><span>{{p.name}}</span></button>
   </section>
  </div>
 </section>
</form></section>
