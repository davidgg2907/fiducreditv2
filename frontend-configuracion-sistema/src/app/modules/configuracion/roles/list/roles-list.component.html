<section class="cfg cfg-list">
<header class="cfg-panel cfg-heading"><div><h2>{{config.title}}</h2><p>Administración de registros</p></div><a *ngIf="can('crear')" class="btn btn-primary" [routerLink]="[home,'nuevo']"><span class="material-icons-outlined" aria-hidden="true">add</span> Crear registro</a></header>
<div class="cfg-panel cfg-search"><label for="module-search">Buscar en {{config.title}} y registros relacionados</label><div class="cfg-search-controls"><input id="module-search" class="form-control" aria-label="Buscar en el módulo" [(ngModel)]="search" placeholder="Buscar por texto" (keyup.enter)="searchRecords()"><button type="button" class="btn btn-primary" (click)="searchRecords()" [disabled]="busy">Buscar</button><button type="button" class="btn btn-outline-secondary" (click)="clearSearch()" [disabled]="busy||!search">Limpiar</button></div></div>
<div *ngIf="error" class="alert alert-danger" role="alert">{{error}}</div>
<section class="cfg-panel cfg-table-panel"><h3>Listado de {{config.title}}</h3><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Nombre del rol</th><th>Sistema(s)</th><th>Acciones</th></tr></thead><tbody>
<tr *ngFor="let row of records"><td class="role-name">{{row['name']}}</td><td class="role-systems">{{systemNames(row['permissions'])}}</td><td><div class="cfg-actions">
<a *ngIf="can('editar')" class="cfg-icon-btn" [routerLink]="[home,row.id,'editar']" title="Editar" aria-label="Editar"><span class="material-icons-outlined" aria-hidden="true">edit</span></a>
<a *ngIf="can('detalle')" class="cfg-icon-btn" [routerLink]="[home,row.id,'detalle']" title="Detalle" aria-label="Detalle"><span class="material-icons-outlined" aria-hidden="true">visibility</span></a>
<button type="button" class="cfg-icon-btn" *ngIf="config.key==='usuarios'&&can('editar')&&!row['is_superadmin']" (click)="toggle(row)" [attr.aria-label]="row['is_active']?'Suspender':'Reactivar'" [title]="row['is_active']?'Suspender':'Reactivar'"><span class="material-icons-outlined" aria-hidden="true">{{row['is_active']?'block':'check_circle'}}</span></button>
<button type="button" class="cfg-icon-btn cfg-icon-btn--danger" *ngIf="can('eliminar')" (click)="remove(row)" title="Eliminar" aria-label="Eliminar"><span class="material-icons-outlined" aria-hidden="true">delete</span></button>
</div></td></tr><tr *ngIf="!records.length&&!busy"><td colspan="3">No se encontraron registros</td></tr></tbody></table></div><p *ngIf="busy">Cargando registros...</p></section>
<nav class="cfg-panel cfg-pagination" aria-label="Paginación de registros"><span class="cfg-result-count">{{total}} registros</span><div class="cfg-pagination-controls">
<button class="btn btn-outline-secondary btn-sm" [disabled]="page<=1||busy" (click)="move(1)" title="Primero" aria-label="Primero"><span class="material-icons-outlined" aria-hidden="true">first_page</span></button>
<button class="btn btn-outline-secondary btn-sm" [disabled]="page<=1||busy" (click)="move(page-1)" title="Anterior" aria-label="Anterior"><span class="material-icons-outlined" aria-hidden="true">chevron_left</span></button>
<button *ngFor="let n of pageNumbers" class="btn btn-sm" [ngClass]="n===page?'btn-primary':'btn-outline-secondary'" [attr.aria-current]="n===page?'page':null" [disabled]="busy" (click)="move(n)">{{n}}</button>
<button class="btn btn-outline-secondary btn-sm" [disabled]="page>=last||busy" (click)="move(page+1)" title="Siguiente" aria-label="Siguiente"><span class="material-icons-outlined" aria-hidden="true">chevron_right</span></button>
<button class="btn btn-outline-secondary btn-sm" [disabled]="page>=last||busy" (click)="move(last)" title="Último" aria-label="Último"><span class="material-icons-outlined" aria-hidden="true">last_page</span></button>
</div></nav></section>
