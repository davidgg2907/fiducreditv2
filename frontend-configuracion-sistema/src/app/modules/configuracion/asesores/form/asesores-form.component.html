<section class="cfg cfg-institutional">
 <header class="cfg-panel cfg-heading">
   <div><h2>{{id?'Editar':'Crear'}} · {{config.title}}</h2><p>Captura y edición de información</p></div>
   <div class="cfg-header-actions">
  <button class="btn btn-primary" form="config-form" type="submit" [disabled]="saving||busy">{{saving?'Guardando...':'Guardar'}}</button>
  <a class="btn btn-outline-secondary cfg-header-cancel" [routerLink]="home"><span class="material-icons-outlined" aria-hidden="true">close</span> Cancelar</a>
</div>
 </header>
 <p *ngIf="error" class="alert alert-danger" role="alert">{{error}}</p>
 <form id="config-form" *ngIf="can(id?'editar':'crear')&&!busy" (ngSubmit)="save()" class="cfg-institutional-form">
 <section class="cfg-panel cfg-form-card cfg-form-card--general" aria-labelledby="datos-generales-title">
   <div class="cfg-form-card__heading"><span class="material-icons-outlined" aria-hidden="true">badge</span>
     <h3 id="datos-generales-title">Datos generales del asesor</h3>
   </div>
   <div class="row g-3"><div class="col-12 col-md-6 col-xl-3" *ngFor="let f of generalFields">
  <div class="field" *ngIf="f.key!=='is_active'&&f.key!=='user_id'&&f.key!=='has_system_access'&&(!id||f.type!=='password')">
    <label [for]="f.key">{{f.label}}{{f.required?' *':''}}</label>
    <select *ngIf="f.type==='ref';else notRef" [id]="f.key" [name]="f.key" class="form-select" [(ngModel)]="data[f.key]" [required]="f.required">
      <option value="">Selecciona...</option>
      <option *ngFor="let r of refs[f.key]||[]" [value]="r.id">{{refLabel(r)}}</option>
    </select>
    <ng-template #notRef>
      <label *ngIf="f.type==='bool';else notBool" class="check">
        <input type="checkbox" [name]="f.key" [(ngModel)]="data[f.key]">
        {{data[f.key]?'Habilitado':'Deshabilitado'}}
      </label>
      <ng-template #notBool>
        <textarea *ngIf="f.type==='json';else plainInput" class="form-control" [id]="f.key" [name]="f.key" rows="4" [(ngModel)]="data[f.key]" [required]="f.required"></textarea>
        <ng-template #plainInput><input class="form-control" [id]="f.key" [name]="f.key" [type]="f.type==='number'?'number':f.type==='date'?'date':'text'"
          [step]="f.type==='number'?'any':undefined" [(ngModel)]="data[f.key]" [required]="f.required"></ng-template>
      </ng-template>
    </ng-template>
  </div>
</div></div>
 </section>
<section class="cfg-panel cfg-form-card cfg-form-card--access" aria-labelledby="asesor-access-title">
  <div class="cfg-form-card__heading">
    <span class="material-icons-outlined" aria-hidden="true">admin_panel_settings</span>
    <h3 id="asesor-access-title">Acceso al sistema</h3>
  </div>
  <label class="check advisor-access-switch cfg-access-toggle">
    <input type="checkbox" name="has_system_access" [(ngModel)]="data['has_system_access']" role="switch" [attr.aria-checked]="!!data['has_system_access']">
    <span>{{data['has_system_access']?'Habilitado: este asesor tendrá acceso al sistema':'Deshabilitado: este asesor no tendrá acceso al sistema'}}</span>
  </label>
</section>
<section *ngIf="data['has_system_access']" class="cfg-panel cfg-form-card cfg-form-card--user" aria-labelledby="asesor-user-title">
  <div class="cfg-form-card__heading">
    <span class="material-icons-outlined" aria-hidden="true">person_add</span>
    <h3 id="asesor-user-title">Información de usuario</h3>
  </div>
  <div class="row g-3">
    <div class="col-12 col-md-6 col-xl-4">
      <div class="field">
        <label for="advisor-user">Cuenta existente (opcional)</label>
        <select id="advisor-user" class="form-select" name="advisor-user" [(ngModel)]="data['user_id']">
          <option value="">Crear usuario nuevo</option>
          <option *ngFor="let u of refs['user_id']||[]" [value]="u.id">{{refLabel(u)}}</option>
        </select>
      </div>
    </div>
    <ng-container *ngIf="!data['user_id']">
      <div class="col-12 col-md-6 col-xl-4"><div class="field">
        <label for="advisor-login-name">Nombre del usuario *</label>
        <input id="advisor-login-name" class="form-control" name="advisor-login-name" [(ngModel)]="newUser.name" required>
      </div></div>
      <div class="col-12 col-md-6 col-xl-4"><div class="field">
        <label for="advisor-login-email">Correo del usuario *</label>
        <input id="advisor-login-email" class="form-control" name="advisor-login-email" type="email" [(ngModel)]="newUser.email" required>
      </div></div>
      <div class="col-12 col-md-6 col-xl-4"><div class="field">
        <label for="advisor-login-role">Rol *</label>
        <select id="advisor-login-role" class="form-select" name="advisor-login-role" [(ngModel)]="newUser.role_id" required>
          <option value="">Selecciona rol</option>
          <option *ngFor="let role of refs['role_id']||[]" [value]="role.id">{{refLabel(role)}}</option>
        </select>
      </div></div>
      <div class="col-12 col-md-6 col-xl-4"><div class="field">
        <label for="advisor-login-password">Contraseña *</label>
        <input id="advisor-login-password" class="form-control" type="password" name="advisor-login-password"
          autocomplete="new-password" minlength="12" [(ngModel)]="newUser.password" required>
      </div></div>
      <div class="col-12 col-md-6 col-xl-4"><div class="field">
        <label for="advisor-login-confirm">Confirmar contraseña *</label>
        <input id="advisor-login-confirm" class="form-control" type="password" name="advisor-login-confirm"
          autocomplete="new-password" minlength="12" [(ngModel)]="newUser.password_confirmation" required>
      </div></div>
      <div *ngIf="newUser.password_confirmation && newUser.password!==newUser.password_confirmation" class="col-12">
        <p class="alert alert-warning" role="alert">Las contraseñas no coinciden.</p>
      </div>
    </ng-container>
  </div>
</section>
<section class="cfg-panel cfg-form-card cfg-form-card--address" aria-labelledby="domicilio-title">
  <div class="cfg-form-card__heading">
    <span class="material-icons-outlined" aria-hidden="true">location_on</span>
    <h3 id="domicilio-title">Domicilio</h3>
  </div>
  <div class="row g-3">
    <div class="col-12 col-md-6 col-xl-2" *ngFor="let f of addressFields">
      <div class="field">
        <label [for]="'address-'+f.key">{{f.label}}{{f.required?' *':''}}</label>
        <input class="form-control" [id]="'address-'+f.key" [name]="f.key" [(ngModel)]="data[f.key]" [required]="f.required"
          [maxlength]="f.key==='postal_code'?5:255" [attr.inputmode]="f.key==='postal_code'?'numeric':null"
          [pattern]="f.key==='postal_code'?'[0-9]{5}':null">
      </div>
    </div>
  </div>
</section>
 
 </form>
</section>
