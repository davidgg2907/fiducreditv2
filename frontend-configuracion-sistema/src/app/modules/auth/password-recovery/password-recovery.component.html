<main class="login-page">
  <section class="login-access" aria-labelledby="recovery-heading">
    <div class="login-access__content">
      <h1 id="recovery-heading">{{ token ? 'Restablecer contraseña' : 'Recuperar acceso' }}</h1>
      <p role="status" *ngIf="message">{{ message }}</p>
      <form class="login-card" *ngIf="!message" #form="ngForm" (ngSubmit)="submit()">
        <label for="recovery-email">Correo electrónico</label>
        <input id="recovery-email" [(ngModel)]="email" name="email" type="email" required email autocomplete="username">
        <ng-container *ngIf="token">
          <label for="new-password">Nueva contraseña</label>
          <input id="new-password" [(ngModel)]="password" name="password" required minlength="12" maxlength="72" type="password" autocomplete="new-password">
          <label for="confirm-password">Confirmar contraseña</label>
          <input id="confirm-password" [(ngModel)]="confirmation" name="confirmation" required type="password" autocomplete="new-password">
        </ng-container>
        <p class="error" role="alert" *ngIf="error">{{ error }}</p>
        <button class="login-submit" type="submit" [disabled]="loading || form.invalid || (!!token && password !== confirmation)">
          {{ token ? 'Guardar contraseña' : 'Enviar enlace' }}
        </button>
      </form>
      <a routerLink="/login">Volver a iniciar sesión</a>
    </div>
  </section>
</main>
