
    <mat-form-field appearance="outline" class="searchable-select-field">
      <mat-label>{{ label }}</mat-label>
      <mat-select [formControl]="boundControl" (openedChange)="onOpenedChange($event)" (selectionChange)="onSelectionChanged($event.value)">
        <mat-option class="search-option" disabled>
          <div class="search-box" (click)="$event.stopPropagation()">
            <mat-icon>search</mat-icon>
            <input
              #searchInput
              matInput
              [formControl]="searchControl"
              placeholder="Filtrar opciones"
              (click)="$event.stopPropagation()"
              (keydown)="$event.stopPropagation()"
            >
          </div>
        </mat-option>

        <mat-option [value]="null">Seleccionar</mat-option>

        <mat-option *ngFor="let option of filteredOptions; trackBy: trackByValue" [value]="option.value">
          {{ option.label }}
        </mat-option>

        <mat-option disabled *ngIf="filteredOptions.length === 0">Sin coincidencias</mat-option>
      </mat-select>

      <mat-error *ngIf="boundControl.touched && boundControl.hasError('required')">
        Selecciona {{ label.toLowerCase() }}.
      </mat-error>
    </mat-form-field>
